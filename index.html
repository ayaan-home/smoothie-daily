const todayStr = () => new Date().toISOString().slice(0, 10);
const dateStr = (d) => d.toISOString().slice(0, 10);

// 시작용 더미 기록 (지난 며칠치) — 프로토타입 체험용
function seedRecords() {
  const recs = [];
  const mk = (uid, daysAgo, type, tags) => {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    recs.push({ id: `${uid}-${daysAgo}`, userId: uid, date: dateStr(d), type, tags });
  };
  // 민지: 최근 4일 연속
  mk("minji", 1, "dawn", ["인삼", "더덕", "마", "우유", "꿀", "배"]);
  mk("minji", 2, "morningA", ["당근", "비트", "연근", "우엉", "요거트"]);
  mk("minji", 3, "evening", ["검은콩", "검은깨", "치아시드", "두유"]);
  mk("minji", 5, "morningB", ["사과", "양배추", "레몬", "생강", "요거트"]);
  // 준호: 최근 2일 연속
  mk("junho", 1, "evening", ["검은콩", "아마씨드", "두유"]);
  mk("junho", 2, "dawn", ["인삼", "마", "우유", "배"]);
  mk("junho", 4, "morningA", ["당근", "비트", "연근", "우엉", "요거트"]);
  return recs;
}

// ---- 스트릭 계산 -------------------------------------------------------------
function calcStreak(records, userId) {
  const dates = new Set(
    records.filter((r) => r.userId === userId).map((r) => r.date)
  );
  let streak = 0;
  const cur = new Date();
  // 오늘 기록이 없으면 어제부터 카운트 (오늘은 아직 안 마셨을 수 있음)
  if (!dates.has(dateStr(cur))) cur.setDate(cur.getDate() - 1);
  while (dates.has(dateStr(cur))) {
    streak++;
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}

// ---- 주간 달성률 (최근 4주) --------------------------------------------------
function calcWeekly(records, userId) {
  const dates = new Set(
    records.filter((r) => r.userId === userId).map((r) => r.date)
  );
  const weeks = [];
  for (let w = 0; w < 4; w++) {
    let hit = 0;
    for (let d = 0; d < 7; d++) {
      const day = new Date();
      day.setDate(day.getDate() - (w * 7 + d));
      if (dates.has(dateStr(day))) hit++;
    }
    weeks.push(Math.round((hit / 7) * 100));
  }
  return weeks.reverse(); // 오래된 주 → 최근 주
}

// ---- 잔디밭 (최근 35일) ------------------------------------------------------
function calcGrass(records, userId) {
  const dates = new Set(
    records.filter((r) => r.userId === userId).map((r) => r.date)
  );
  const cells = [];
  for (let i = 34; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    cells.push({ date: dateStr(day), filled: dates.has(dateStr(day)) });
  }
  return cells;
}

// ========================================================================
//  메인 컴포넌트
// ========================================================================
function SmoothieDaily() {
  const [records, setRecords] = useState(seedRecords);
  const [activeUser, setActiveUser] = useState("minji");
  const [tab, setTab] = useState("home"); // home | garden | stats

  // 기록 입력 폼 상태
  const [selType, setSelType] = useState(null);

  const today = todayStr();
  const user = USERS.find((u) => u.id === activeUser);
  const todayRecord = records.find(
    (r) => r.userId === activeUser && r.date === today
  );

  const streak = useMemo(
    () => calcStreak(records, activeUser),
    [records, activeUser]
  );
  const weekly = useMemo(
    () => calcWeekly(records, activeUser),
    [records, activeUser]
  );
  const grass = useMemo(
    () => calcGrass(records, activeUser),
    [records, activeUser]
  );

  // ---- 기록 저장 (선택한 스무디의 레시피를 자동 저장) ----
  const saveRecord = () => {
    if (!selType) return;
    const info = SMOOTHIE_TYPES.find((t) => t.id === selType);
    const newRec = {
      id: `${activeUser}-${today}-${Date.now()}`,
      userId: activeUser,
      date: today,
      type: selType,
      tags: info ? info.recipe : [],
    };
    setRecords((prev) => [
      ...prev.filter((r) => !(r.userId === activeUser && r.date === today)),
      newRec,
    ]);
    setSelType(null);
  };

  const undoToday = () => {
    setRecords((prev) =>
      prev.filter((r) => !(r.userId === activeUser && r.date === today))
    );
  };

  // ====================================================================
  return (
    <div style={S.app}>
      <div style={S.phone}>
        {/* ---- 헤더 ---- */}
        <div style={S.header}>
          <div style={S.hello}>
            {tab === "home"
              ? "좋은 아침이에요"
              : tab === "garden"
              ? `${user.name}님의 기록`
              : tab === "stats"
              ? "우리 부부의"
              : "스무디 재료별"}
          </div>
          <div style={S.title}>
            {tab === "home"
              ? "오늘의 스무디 🥤"
              : tab === "garden"
              ? "나의 잔디밭 🌱"
              : tab === "stats"
              ? "주간 통계 📊"
              : "효능 사전 📖"}
          </div>

          {/* 사용자 전환 */}
          <div style={S.userSwitch}>
            {USERS.map((u) => (
              <button
                key={u.id}
                onClick={() => setActiveUser(u.id)}
                style={{
                  ...S.userChip,
                  ...(u.id === activeUser ? S.userChipOn : {}),
                }}
              >
                {u.avatar} {u.name}
              </button>
            ))}
          </div>
        </div>

        {/* ---- 본문 ---- */}
        <div style={S.body}>
          {tab === "home" && (
            <HomeScreen
              todayRecord={todayRecord}
              selType={selType}
              setSelType={setSelType}
              saveRecord={saveRecord}
              undoToday={undoToday}
            />
          )}
          {tab === "garden" && <GardenScreen streak={streak} grass={grass} />}
          {tab === "stats" && (
            <StatsScreen weekly={weekly} records={records} />
          )}
          {tab === "benefit" && <BenefitScreen />}
        </div>

        {/* ---- 하단 탭 ---- */}
        <div style={S.tabBar}>
          {[
            { id: "home", icon: "✓", label: "기록" },
            { id: "garden", icon: "🌱", label: "잔디밭" },
            { id: "stats", icon: "📊", label: "통계" },
            { id: "benefit", icon: "📖", label: "효능" },
          ].map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                ...S.tabBtn,
                ...(tab === t.id ? S.tabBtnOn : {}),
              }}
            >
              <div style={{ fontSize: 20 }}>{t.icon}</div>
              <div style={{ fontSize: 11, fontWeight: 700 }}>{t.label}</div>
            </button>
          ))}
        </div>
      </div>

      <p style={S.note}>
        🥤 스무디 데일리 · 프로토타입 — 데이터는 메모리에만 저장됩니다
        (새로고침 시 초기화)
      </p>
    </div>
  );
}

function HomeScreen({
  todayRecord,
  selType,
  setSelType,
  saveRecord,
  undoToday,
}) {
  // 이미 오늘 기록이 있으면 완료 화면
  if (todayRecord) {
    const typeInfo = SMOOTHIE_TYPES.find((t) => t.id === todayRecord.type);
    return (
      <div>
        <div style={S.doneCard}>
          <div style={{ fontSize: 44 }}>🎉</div>
          <div style={S.doneTitle}>오늘 기록 완료!</div>
          <div style={S.doneSub}>
            {typeInfo?.emoji} {typeInfo?.label} 스무디
          </div>
          {typeInfo && (
            <div style={S.tagWrap}>
              {typeInfo.recipe.map((t) => (
                <span key={t} style={S.tagShow}>
                  {t}
                </span>
              ))}
            </div>
          )}
        </div>
        <button onClick={undoToday} style={S.undoBtn}>
          기록 취소하고 다시 선택
        </button>
      </div>
    );
  }

  // 입력 폼 — 스무디 선택만 (재료 태그 입력 없음)
  const selInfo = selType
    ? SMOOTHIE_TYPES.find((t) => t.id === selType)
    : null;

  return (
    <div>
      <div style={S.bigCheck}>
        <div style={S.checkQ}>오늘 스무디 마셨나요?</div>
        <div style={{ fontSize: 13, color: "#6b5560", marginTop: 4 }}>
          마신 스무디를 골라주세요
        </div>
      </div>

      <div style={S.miniLabel}>어떤 스무디였나요?</div>
      <div style={S.smoothieList}>
        {SMOOTHIE_TYPES.map((t) => (
          <button
            key={t.id}
            onClick={() => setSelType(t.id)}
            style={{
              ...S.smoothieCard,
              ...(selType === t.id ? S.smoothieCardOn : {}),
            }}
          >
            <div style={S.smoothieCardTop}>
              <span style={{ fontSize: 22 }}>{t.emoji}</span>
              <span style={S.smoothieCardName}>{t.label}</span>
              <span style={S.smoothieCardTime}>{t.time}</span>
            </div>
            <div style={S.smoothieCardRecipe}>{t.recipe.join(" + ")}</div>
          </button>
        ))}
      </div>

      <button
        onClick={saveRecord}
        disabled={!selType}
        style={{
          ...S.saveBtn,
          ...(!selType ? S.saveBtnOff : {}),
        }}
      >
        {selInfo
          ? `✓ ${selInfo.label} 스무디 기록하기`
          : "스무디를 골라주세요"}
      </button>
    </div>
  );
}

function StatsScreen({ weekly, records }) {
  return (
    <div>
      <div style={S.miniLabel}>주별 달성률 (최근 4주)</div>
      {weekly.map((pct, i) => (
        <div key={i} style={S.barRow}>
          <span style={S.barWk}>{i + 1}주</span>
          <div style={S.barTrack}>
            <div style={{ ...S.barFill, width: `${pct}%` }} />
          </div>
          <span style={S.barPct}>{pct}%</span>
        </div>
      ))}

      <div style={S.miniLabel}>가족 기록</div>
      {USERS.map((u) => {
        const s = calcStreak(records, u.id);
        const cnt = records.filter((r) => r.userId === u.id).length;
        return (
          <div key={u.id} style={S.partnerRow}>
            <span style={{ fontSize: 20 }}>{u.avatar}</span>
            <span style={S.partnerName}>{u.name}</span>
            <span style={S.partnerStat}>총 {cnt}회</span>
            <span style={S.partnerStreak}>🔥 {s}일</span>
          </div>
        );
      })}
    </div>
  );
}
