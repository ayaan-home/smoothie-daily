// 로컬(기기) 시간 기준 날짜 YYYY-MM-DD — 한국 시간대 반영
function localDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
const todayStr = () => localDate(new Date());
const dateStr = (d) => localDate(d);

// ---- 스트릭 계산 -------------------------------------------------------------
function calcStreak(records, userId) {
  const dates = new Set(
    records.filter((r) => r.userId === userId).map((r) => r.date)
  );
  let streak = 0;
  const cur = new Date();
  // 오늘 기록이 없으면 어제부터 카운트 (오늘은 아직 안 마셨을 수 있음)
  if (!dates.has(dateStr(cur))) cur.setDate(cur.getDate() - 1);
  while (dates.has(dateStr(cur))) {
    streak++;
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}

// ---- 주간 달성률 (최근 4주) --------------------------------------------------
function calcWeekly(records, userId) {
  const dates = new Set(
    records.filter((r) => r.userId === userId).map((r) => r.date)
  );
  const weeks = [];
  for (let w = 0; w < 4; w++) {
    let hit = 0;
    for (let d = 0; d < 7; d++) {
      const day = new Date();
      day.setDate(day.getDate() - (w * 7 + d));
      if (dates.has(dateStr(day))) hit++;
    }
    weeks.push(Math.round((hit / 7) * 100));
  }
  return weeks.reverse(); // 오래된 주 → 최근 주
}

// ---- 잔디밭 (최근 35일) ------------------------------------------------------
function calcGrass(records, userId) {
  const dates = new Set(
    records.filter((r) => r.userId === userId).map((r) => r.date)
  );
  const cells = [];
  for (let i = 34; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    cells.push({ date: dateStr(day), filled: dates.has(dateStr(day)) });
  }
  return cells;
}

        setDbError("");
        setLoading(false);

            {sm.emoji} {sm.label} 스무디
          </div>
          {sm.recipe.map((ing) => {
            const info = INGREDIENT_INFO.find((x) => x.name === ing);
            if (!info) return null;
            return (
              <div key={ing} style={S.benefitRow}>
                <span style={S.benefitEmoji}>{info.emoji}</span>
                <span style={S.benefitName}>{info.name}</span>
                <span style={S.benefitText}>{info.benefit}</span>
              </div>
            );
          })}
        </div>
      ))}
      <div style={S.benefitNote}>
        ※ 일반적으로 알려진 건강 상식이며, 의학적 진단·치료 효과를 보장하지
        않습니다.
      </div>
    </div>
  );
}

// ========================================================================
//  아이폰 "홈 화면에 추가" 안내 배너
//  - 아이폰 사파리에서, 아직 홈 화면 앱으로 안 쓰고 있을 때만 표시
//  - 한 번 닫으면 다시 표시하지 않음 (기기에 기억)
// ========================================================================
function IOSInstallBanner() {
  const [show, setShow] = useState(false);

  useEffect(() => {
    try {
      const ua = window.navigator.userAgent || "";
      const isIOS = /iphone|ipad|ipod/i.test(ua);
      const isStandalone =
        window.navigator.standalone === true ||
        (window.matchMedia &&
          window.matchMedia("(display-mode: standalone)").matches);
      let dismissed = false;
      try {
        dismissed = window.localStorage.getItem("smd_ios_banner") === "off";
      } catch (e) {}
      if (isIOS && !isStandalone && !dismissed) setShow(true);
    } catch (e) {}
  }, []);

  const close = () => {
    setShow(false);
    try {
      window.localStorage.setItem("smd_ios_banner", "off");
    } catch (e) {}
  };

  if (!show) return null;

  return (
    <div style={S.iosBanner}>
      <button onClick={close} style={S.iosBannerClose} aria-label="닫기">
        ✕
      </button>
      <div style={S.iosBannerTitle}>📲 홈 화면에 추가하면 더 편해요</div>
      <div style={S.iosBannerText}>
        사파리 아래쪽의 <b>공유 버튼</b>(네모에 화살표 ⬆️ 모양)을 누른 뒤,
        <b> '홈 화면에 추가'</b>를 선택하세요. 진짜 앱처럼 아이콘으로 열 수
        있어요!
      </div>
      <div className="smd-arrow" style={S.iosBannerArrow}>
        ⬇︎
      </div>
    </div>
  );
}
